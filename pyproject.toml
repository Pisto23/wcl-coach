[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcl-coach"
version = "0.1.0"
description = "Analyze Warcraft Logs reports and get prioritized improvement tips"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wcl-coach = "wcl_coach.cli:main"

[tool.setuptools]
packages = ["wcl_coach"]
